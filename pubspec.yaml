name: fersal_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_fersal.PNG"
  min_sdk_android: 21
  adaptive_icon_background: "#1B62D4"
  adaptive_icon_foreground: "assets/images/logo_fersal.PNG"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_fersal.PNG