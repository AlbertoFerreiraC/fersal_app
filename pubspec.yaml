name: fersal_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_pdfviewer: ^30.2.7
  share_plus: ^10.0.2
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  biometric_signature: ^13.3.0
  flutter_secure_storage: ^10.3.4
  intl: ^0.19.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icono_app_fersal.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icono_app_fersal.png"
  adaptive_icon_foreground_inset: 13

flutter:
  uses-material-design: true
  assets:
    - assets/images/icono_app_fersal.png
    - assets/images/logo_fersal.PNG